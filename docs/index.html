<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://carrot-blood-pressure-api.pages.dev http://127.0.0.1:8787; manifest-src 'self'; img-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f1f7f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>家庭血压本</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=9">
  <script type="module" src="./app.js?v=9"></script>
</head>
<body>
  <main>
    <header class="heading">
      <div>
        <p class="eyebrow">家人共享</p>
        <h1>家庭血压本</h1>
      </div>
      <button id="logout" class="secondary" type="button" hidden>退出</button>
    </header>

    <section id="welcome" class="card">
      <p id="welcome-message" role="status">正在打开血压本…</p>
      <form id="login-form" hidden>
        <label for="username">账号</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button id="login" type="submit">登录</button>
      </form>
    </section>

    <div id="book" hidden>
      <nav aria-label="血压本功能">
        <button id="new-tab" class="secondary" type="button" aria-pressed="true">记血压</button>
        <button id="history-tab" class="secondary" type="button" aria-pressed="false">看历史</button>
      </nav>
      <p id="sync-status" class="status" role="status"></p>

      <section id="new-panel" class="card" aria-labelledby="new-heading">
        <h2 id="new-heading">记血压</h2>
        <form id="record-form">
          <fieldset id="record-fields">
            <label for="person">测量人</label>
            <select id="person" name="person" required>
              <option value="" selected disabled>请选择测量人</option>
              <option value="father">爸爸</option>
              <option value="mother">妈妈</option>
            </select>
            <div class="readings">
              <label for="systolic">高压 <small>mmHg</small></label>
              <label for="diastolic">低压 <small>mmHg</small></label>
              <input id="systolic" name="systolic" type="number" inputmode="numeric" min="1" max="999" required placeholder="高压">
              <input id="diastolic" name="diastolic" type="number" inputmode="numeric" min="1" max="999" required placeholder="低压">
            </div>
            <label for="pulse">脉搏 <small>选填</small></label>
            <input id="pulse" name="pulse" type="number" inputmode="numeric" min="1" max="999" placeholder="次/分钟">
            <label for="measured-at">测量时间 <small>北京时间</small></label>
            <input id="measured-at" name="measuredAt" type="datetime-local" min="2000-01-01T00:00" max="2099-12-31T23:59" required>
          </fieldset>
          <button id="save" type="submit">保存记录</button>
          <p id="save-status" class="status" role="status"></p>
        </form>
      </section>

      <div id="history-panel" hidden>
        <section class="card history-trend" aria-labelledby="trend-title">
          <div class="history-card-head">
            <div>
              <h2 id="trend-title">月度趋势</h2>
              <p id="trend-description">同一天测量多次时，取当天平均值</p>
            </div>
            <div class="trend-people" aria-label="查看谁的趋势">
              <button type="button" data-trend-person="father" aria-pressed="true">爸爸</button>
              <button type="button" data-trend-person="mother" aria-pressed="false">妈妈</button>
            </div>
          </div>
          <ul class="trend-legend" aria-label="图例">
            <li class="high"><i aria-hidden="true"></i>高压 <small>mmHg</small></li>
            <li class="low"><i aria-hidden="true"></i>低压 <small>mmHg</small></li>
            <li class="pulse"><i aria-hidden="true"></i>脉搏 <small>次/分</small></li>
          </ul>
          <canvas id="trend-chart" role="img" aria-label="高压、低压和脉搏的月度趋势图" aria-describedby="trend-description trend-point"></canvas>
          <p id="trend-empty" class="history-empty" hidden></p>
          <p id="trend-point" class="trend-point" aria-live="polite"></p>
        </section>

        <section class="card history-calendar" aria-labelledby="history-month-title">
          <div class="history-card-head">
            <h2 id="history-month-title" aria-live="polite"></h2>
            <div class="month-actions" aria-label="切换月份">
              <button id="previous-month" class="secondary" type="button" aria-label="上个月"><i aria-hidden="true"></i></button>
              <button id="next-month" class="secondary" type="button" aria-label="下个月"><i aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="history-weekdays" aria-hidden="true">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div id="history-days" aria-label="本月日期"></div>
          <div class="calendar-footer">
            <p class="calendar-key"><span aria-hidden="true"></span>有测量记录</p>
            <button id="refresh" class="secondary" type="button">刷新</button>
          </div>
        </section>

        <section class="card history-day-card" aria-labelledby="history-day-title">
          <div class="history-card-head">
            <h2 id="history-day-title"></h2>
            <p id="history-status" class="status" role="status"></p>
          </div>
          <p id="history-empty" class="history-empty" role="status" hidden></p>
          <p id="history-notice" class="status" role="status"></p>
          <ul id="history-list" aria-label="测量记录"></ul>
        </section>
      </div>
    </div>
  </main>
  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <h2 id="edit-heading" tabindex="-1" autofocus>编辑记录</h2>
    <p class="status">测量时间 <time id="edit-time"></time> <small>北京时间</small></p>
    <form id="edit-form">
      <fieldset id="edit-fields">
        <label for="edit-person">测量人</label>
        <select id="edit-person" name="person">
          <option value="">未标注</option>
          <option value="father">爸爸</option>
          <option value="mother">妈妈</option>
        </select>
        <div class="readings">
          <label for="edit-systolic">高压 <small>mmHg</small></label>
          <label for="edit-diastolic">低压 <small>mmHg</small></label>
          <input id="edit-systolic" name="systolic" type="number" inputmode="numeric" min="1" max="999" required>
          <input id="edit-diastolic" name="diastolic" type="number" inputmode="numeric" min="1" max="999" required>
        </div>
        <label for="edit-pulse">脉搏 <small>选填</small></label>
        <input id="edit-pulse" name="pulse" type="number" inputmode="numeric" min="1" max="999">
      </fieldset>
      <div class="edit-actions">
        <button id="edit-cancel" class="secondary" type="button">取消</button>
        <button id="edit-save" type="submit">保存修改</button>
      </div>
      <p id="edit-status" class="status" role="status"></p>
    </form>
  </dialog>
</body>
</html>
